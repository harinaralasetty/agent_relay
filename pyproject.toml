[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "peercourier"
version = "0.1.0"
description = "Durable local conversations between agents from different runtimes"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Hari Naralasetty"}]
dependencies = ["mcp>=1.20,<2"]

[project.scripts]
peercourier = "peercourier.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1", "build>=1.2,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/peercourier"]
